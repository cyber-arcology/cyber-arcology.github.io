<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="cyber-civitas">
  <!-- Family frame: the cyber-* command reticle. Identical in every cyber-* package. -->
  <path class="s" d="M17 63V17h46"/>
  <path class="s" d="M111 65v46H65"/>
  <!-- Glyph slot (32..96): three citizens, the front one an agent whose head is the AI spark.
       The mask cuts a gap where the front citizen overlaps the two behind. -->
  <mask id="front" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
    <rect width="128" height="128" fill="#fff"/>
    <g fill="#000" stroke="#000" stroke-width="10" stroke-linejoin="round">
    <path d="M64 33q2.6 11 13 13q-10.4 2-13 13q-2.6-11-13-13q10.4-2 13-13Z"/>
    <path d="M46 96v-16a18 18 0 0 1 36 0v16Z"/>
    </g>
  </mask>
  <g class="f" mask="url(#front)">
    <circle cx="40" cy="58" r="8"/>
    <path d="M28 96v-13a12 12 0 0 1 24 0v13Z"/>
    <circle cx="88" cy="58" r="8"/>
    <path d="M76 96v-13a12 12 0 0 1 24 0v13Z"/>
  </g>
  <g class="f">
    <path d="M64 33q2.6 11 13 13q-10.4 2-13 13q-2.6-11-13-13q10.4-2 13-13Z"/>
    <path d="M46 96v-16a18 18 0 0 1 36 0v16Z"/>
  </g>
  <style>.f{fill:#000}.s{fill:none;stroke:#000;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}@media (prefers-color-scheme:dark){.f{fill:#fff}.s{stroke:#fff}}</style>
</svg>
